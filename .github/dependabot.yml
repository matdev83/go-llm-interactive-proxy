version: 2
updates:
  # Keep root and every independent module in one multi-directory update
  # stream; Dependabot applies dependency groups per module directory.
  # The repository's module synchronization check validates the resulting
  # graph with GOWORK=off.
  - package-ecosystem: gomod
    directories:
      - /
      - /testdata/enterprise_module
      - /testdata/external_connector
      - /testdata/external_feature_sdk
      - /connector-support/acp
      - /connector-support/oauthcred
      - /connector-support/openaicompat
      - /connectors/acp
      - /connectors/agycliacp
      - /connectors/azure
      - /connectors/cloudflare
      - /connectors/codex
      - /connectors/cohere
      - /connectors/commandcode-anthropic
      - /connectors/commandcode-openai
      - /connectors/cursorcliacp
      - /connectors/databricks
      - /connectors/geminicliacp
      - /connectors/gitlabduo
      - /connectors/huggingface
      - /connectors/infomaniak
      - /connectors/llamacpp
      - /connectors/lmstudio
      - /connectors/localstub
      - /connectors/minimexoauth
      - /connectors/nousportal
      - /connectors/nvidia
      - /connectors/oci
      - /connectors/ollama
      - /connectors/opencode
      - /connectors/openrouter
      - /connectors/qwenoauth
      - /connectors/replicate
      - /connectors/sagemaker
      - /connectors/sapaicore
      - /connectors/snowflake
      - /connectors/vertex
      - /connectors/vllm
      - /connectors/watsonx
      - /connectors/xaioauth
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # Wait a few days so yanked or broken releases never reach a PR.
    cooldown:
      default-days: 3
    # Bun 1.3 changes NUL-delimited journal identity semantics; re-enable once
    # the compatibility work lands. Patch updates keep flowing.
    ignore:
      - dependency-name: "github.com/uptrace/bun*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    # One group per dependency family (first match wins). A breaking release in
    # one family blocks only its own PR instead of a 30-directory bundle.
    groups:
      go-patch:
        update-types:
          - patch
        patterns:
          - "*"
      go-provider-sdks:
        update-types:
          - minor
        patterns:
          - "github.com/anthropics/*"
          - "github.com/openai/*"
          - "github.com/aws/*"
          - "google.golang.org/genai"
          - "cloud.google.com/*"
      go-grpc-proto:
        update-types:
          - minor
        patterns:
          - "google.golang.org/grpc*"
          - "google.golang.org/protobuf"
          - "google.golang.org/genproto*"
      go-telemetry:
        update-types:
          - minor
        patterns:
          - "go.opentelemetry.io/*"
          - "github.com/prometheus/*"
      go-storage:
        update-types:
          - minor
        patterns:
          - "modernc.org/*"
          - "github.com/jackc/*"
          - "github.com/oschwald/*"
      go-minor:
        update-types:
          - minor
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
