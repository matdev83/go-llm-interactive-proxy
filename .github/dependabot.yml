version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    groups:
      go-patch:
        patterns:
          - "*"
        update-types:
          - patch
      go-minor:
        patterns:
          - "*"
        update-types:
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    groups:
      github-actions:
        patterns:
          - "*"
