version: 2
updates:
  # Keep root and every independent module in one multi-directory update
  # stream; Dependabot applies dependency groups per module directory.
  # The repository's module synchronization check validates the resulting
  # graph with GOWORK=off.
  - package-ecosystem: gomod
    directories:
      - /
      - /testdata/enterprise_module
      - /testdata/external_connector
      - /connector-support/acp
      - /connector-support/openaicompat
      - /connectors/acp
      - /connectors/agycliacp
      - /connectors/codex
      - /connectors/commandcode-anthropic
      - /connectors/commandcode-openai
      - /connectors/cursorcliacp
      - /connectors/cursorsdk
      - /connectors/geminicliacp
      - /connectors/huggingface
      - /connectors/llamacpp
      - /connectors/lmstudio
      - /connectors/localstub
      - /connectors/nvidia
      - /connectors/ollama
      - /connectors/opencode
      - /connectors/openrouter
      - /connectors/vllm
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      go-patch:
        patterns:
          - "*"
        update-types:
          - patch
      go-minor:
        patterns:
          - "*"
        update-types:
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
