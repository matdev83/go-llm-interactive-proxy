name: Node independence

on:
  schedule:
    - cron: "27 3 * * *"
  pull_request:
    # labeled/unlabeled so applying or removing the exemption actually re-runs the
    # gate it unblocks, instead of waiting for the next push to notice.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  LIP_ALLOW_LARGE_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'allow-large-change') && '1' || '' }}

concurrency:
  # Share the branch/PR group so a new push cancels the superseded no-Node run
  # instead of consuming another hosted runner.
  group: node-independence-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect host build-surface changes
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.filter.outputs.host }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The lane replays the whole host verification surface, so an unrelated
      # documentation or skill-only PR must not burn a runner. Every bypass
      # still reports success so the workflow stays mergeable.
      - name: Classify changed files
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" && "$EVENT_NAME" != "merge_group" && "$EVENT_NAME" != "push" ]] || [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0{40}$ ]]; then
            echo "host=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git rev-parse --verify "${BASE_SHA}^{commit}" >/dev/null
          host=false
          # The lane guards one property: the root build must never need Node. A
          # change can only break that by (a) altering the guard itself or module/
          # packaging inputs, or (b) introducing a Node toolchain reference in the
          # Makefile, scripts, tools or composite actions. A one-line edit that
          # mentions neither used to cost every PR a 7-14 minute run (cache policy
          # budgets and cache-action edits are the common case); the daily schedule
          # still replays the lane.
          node_ref='\b(node|npm|npx|yarn|pnpm|bun|deno)\b|\.(m|c)?js\b|\.ts\b'
          while IFS= read -r file; do
            case "$file" in
              go.mod|go.sum|go.work|go.work.sum|\
              .golangci.yml|.goreleaser.yaml|.goreleaser.yml|.release-files|\
              tools/backendplugin/node_independence/*|scripts/check-node-independence.*|\
              .github/workflows/node-independence.yml)
                host=true
                break
                ;;
              Makefile|tools/*|scripts/*|.github/actions/*)
                if git diff --unified=0 "$BASE_SHA" HEAD -- "$file" \
                  | grep -E '^[+-]' | grep -vE '^(---|\+\+\+)' | grep -iE "$node_ref" >/dev/null; then
                  host=true
                  break
                fi
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" HEAD)
          echo "host=$host" >> "$GITHUB_OUTPUT"

  no-node:
    name: no-node
    needs: changes
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Fail closed if scope detection failed
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Report unrelated bypass
        if: needs.changes.result == 'success' && needs.changes.outputs.host != 'true'
        run: |
          echo "No-Node lane bypassed: no host build surface changed."
          echo "The no-node job remains successful for branch-protection semantics."
      - name: Check out exact head
        if: needs.changes.result == 'success' && needs.changes.outputs.host == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Go is the only documented build prerequisite this lane provisions. Node
      # is deliberately never set up: the lane proves unavailability with
      # tripwires instead of trusting the runner image.
      - name: Setup Go
        if: needs.changes.result == 'success' && needs.changes.outputs.host == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # The shared composite owns cache identity, size and main publication.
          cache: false

      # Replay the same mandatory quality gates as CI with their prerequisites
      # installed. Missing analyzers must fail, not narrow the no-Node proof.
      - name: Install host verification tools
        if: needs.changes.result == 'success' && needs.changes.outputs.host == 'true'
        env:
          GOLANGCI_LINT_VERSION: 2.14.0
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep
          for attempt in 1 2 3; do
            if go install github.com/bufbuild/buf/cmd/buf@v1.66.0; then break; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep $((attempt * 15))
          done
          archive="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz"
          curl --retry 3 -sSfLo "$RUNNER_TEMP/$archive" "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/$archive"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64" >> "$GITHUB_PATH"

      # The full lane produced 6,014 MiB on main; a 1,536 MiB snapshot evicted
      # most entries; the next runs spent 7-9 minutes in the first unit pass.
      # policy.json retains up to 7 GiB for this lane (including growth room).
      - name: Restore bounded no-node Go cache
        if: needs.changes.result == 'success' && needs.changes.outputs.host == 'true'
        uses: ./.github/actions/go-cache
        with:
          lane: node-independence

      # The full documented verification surface runs on every pull request. A reduced
      # subset was rejected: a PR that only exercises the fast set would leave the
      # quality, packaging and comprehensive steps unproven until merge.
      - name: Run host verification with Node unavailable
        if: needs.changes.result == 'success' && needs.changes.outputs.host == 'true'
        run: bash scripts/check-node-independence.sh --set full --report "$RUNNER_TEMP/node-independence.json"

      - name: Upload no-Node evidence
        if: always() && needs.changes.result == 'success' && needs.changes.outputs.host == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: node-independence-${{ github.run_id }}
          path: ${{ runner.temp }}/node-independence.json
          retention-days: 14
          if-no-files-found: error

      # Only successful main work publishes the advancing baseline.
      - name: Save bounded no-node Go cache
        if: success() && needs.changes.result == 'success' && needs.changes.outputs.host == 'true'
        uses: ./.github/actions/go-cache
        with:
          lane: node-independence
          phase: save
