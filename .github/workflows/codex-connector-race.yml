# Narrow Linux race gate for connectors/codex (Task 8.2).
# Windows hosts cannot run -race for this module (cgo toolchain failure).
name: Codex connector race

on:
  pull_request:
    paths:
      - "connectors/codex/**"
      - ".github/workflows/codex-connector-race.yml"
  push:
    branches: [main]
    paths:
      - "connectors/codex/**"
      - ".github/workflows/codex-connector-race.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            connectors/codex/go.sum

      - name: Race connectors/codex
        working-directory: connectors/codex
        run: GOWORK=off go test -race ./...
