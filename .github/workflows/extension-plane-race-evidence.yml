# Disposable workflow to collect authoritative Linux CI race evidence for task 10.2.
name: Extension Plane Race Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/extension-plane-race-evidence.yml"

permissions:
  contents: read

concurrency:
  group: extension-plane-race-evidence-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux-extension-plane-race:
    name: linux-extension-plane-race
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            connectors/**/go.sum
            connector-support/**/go.sum
            testdata/enterprise_module/go.sum
            tools/**/go.sum

      - name: Run exact Linux race command
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -race ./internal/core/extensions ./internal/infra/runtimebundle
