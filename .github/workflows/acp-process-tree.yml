# Narrow Phase 6 gate: native ACP process-tree cleanup + cursorcliacp module tests.
# Not a duplicate of full QA; path-filtered and matrix-only for these packages.
name: ACP process-tree

on:
  pull_request:
    paths:
      - "connector-support/acp/**"
      - "connectors/cursorcliacp/**"
      - "Makefile"
      - ".github/workflows/acp-process-tree.yml"
      - "internal/archtest/acp_process_tree_ci_test.go"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-tree:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            connector-support/acp/go.sum
            connectors/cursorcliacp/go.sum

      - name: Native process-tree (Unix)
        if: runner.os != 'Windows'
        working-directory: connector-support/acp
        env:
          GOWORK: "off"
        shell: bash
        run: go test -count=1 -timeout=10m -run 'KillProcessTree_|ProcessTree_CrossCompile' ./...

      - name: Cursor connector (Unix)
        if: runner.os != 'Windows'
        working-directory: connectors/cursorcliacp
        env:
          GOWORK: "off"
        shell: bash
        run: go test -count=1 -timeout=10m -run 'TestParity_|TestDescribe_' ./...

      - name: Native process-tree (Windows)
        if: runner.os == 'Windows'
        working-directory: connector-support/acp
        env:
          GOWORK: "off"
        shell: pwsh
        run: go test -count=1 -timeout=10m -run "KillProcessTree_|ProcessTree_CrossCompile" ./...

      - name: Cursor connector (Windows)
        if: runner.os == 'Windows'
        working-directory: connectors/cursorcliacp
        env:
          GOWORK: "off"
        shell: pwsh
        run: go test -count=1 -timeout=10m -run "TestParity_|TestDescribe_" ./...
