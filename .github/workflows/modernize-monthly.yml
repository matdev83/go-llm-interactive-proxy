# Monthly Go modernization / vulnerability hygiene.
# Runs the modernize linter suite and govulncheck on a schedule.
name: Modernize monthly

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 1 * *" # 04:41 UTC on the 1st of each month

permissions:
  contents: read

jobs:
  modernize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            connectors/**/go.sum
            connector-support/**/go.sum
            testdata/enterprise_module/go.sum
            tools/**/go.sum

      - name: golangci-lint (modernize only)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=10m --enable-only=modernize

      - name: govulncheck
        run: go tool govulncheck ./...
