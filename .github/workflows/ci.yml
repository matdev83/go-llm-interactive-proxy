name: CI

on:
  # Feature branches are validated by their pull request. Restricting push
  # avoids running the same commit twice after a PR has been opened.
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

env:
  LIP_ALLOW_LARGE_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'allow-large-change') && '1' || '' }}

concurrency:
  # Push and PR events for the same branch share a group, avoiding duplicate runs.
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      test: ${{ steps.filter.outputs.test }}
      test_cost: ${{ steps.filter.outputs.test_cost }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate CI scope matcher
        shell: bash
        run: bash scripts/ci-scope.sh --self-test

      - name: Classify changed files
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            bash scripts/ci-scope.sh --outputs "" HEAD >> "$GITHUB_OUTPUT"
          else
            bash scripts/ci-scope.sh --outputs "${BASE_SHA:-}" HEAD >> "$GITHUB_OUTPUT"
          fi

  repo-hygiene:
    name: Repo hygiene
    needs: [changes, db-parity]
    if: always()
    # This is a required status check. A job-level `if` would skip the whole
    # job on docs-only PRs, and GitHub does not count a skipped required
    # check as satisfied, permanently blocking the merge. Always run the job
    # and skip the work steps instead so the check reports success.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail closed if scope detection failed
        if: needs.changes.result != 'success'
        shell: bash
        run: |
          echo "CI scope detection failed; refusing to bypass required evidence." >&2
          exit 1

      - name: Fail closed if database parity failed
        if: always() && needs.db-parity.result != 'success'
        shell: bash
        run: |
          echo "Database parity check failed or was cancelled; refusing to satisfy required repo hygiene status." >&2
          exit 1

      - name: Check out repository
        if: needs.changes.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        if: needs.changes.result == 'success' && github.event_name == 'pull_request'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Check change size
        if: needs.changes.result == 'success' && github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: go run ./tools/changesize --base "$BASE_SHA" --head HEAD

      - name: Check repository file manifest
        if: needs.changes.result == 'success' && needs.changes.outputs.code == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSHED_REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # The final PR tree is authoritative; the manifest may be completed
            # by a later commit than the files it approves.
            commits=""
          elif [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            commits=$(git rev-list --reverse "$BEFORE_SHA..HEAD")
          else
            # For a new branch, exclude commits reachable from other tracking
            # refs on origin, but not the just-created destination ref itself.
            exclusions=()
            while read -r tracking_ref; do
              [[ "$tracking_ref" == "refs/remotes/origin/${PUSHED_REF#refs/heads/}" ]] && continue
              exclusions+=("$tracking_ref")
            done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)
            commits=$(git rev-list --reverse HEAD --not "${exclusions[@]}")
          fi

          while read -r commit; do
            [[ -n "$commit" ]] && bash scripts/check-release-clean.sh --ref "$commit"
          done <<< "$commits"

          bash scripts/check-release-clean.sh --ref HEAD

      - name: Report unrelated PR bypass
        if: needs.changes.result == 'success' && needs.changes.outputs.code != 'true'
        shell: bash
        run: |
          echo "Repo hygiene manifest check bypassed: documentation-only changes detected."

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: always()
    # Required status check: see repo-hygiene above. Always run the job so the
    # matrix variants report success (not skip) on docs-only PRs; guard steps.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            packages: ./cmd/lipstd ./pkg/credpool ./pkg/lipapi ./pkg/lipsdk/... ./pkg/streampump
          - os: windows-latest
            packages: ./pkg/credpool ./pkg/lipapi ./pkg/lipsdk/... ./pkg/streampump
          - os: macos-latest
            packages: ./pkg/credpool ./pkg/lipapi ./pkg/lipsdk/... ./pkg/streampump
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Fail closed if scope detection failed
        if: needs.changes.result != 'success'
        shell: bash
        run: |
          echo "CI scope detection failed; refusing to bypass required evidence." >&2
          exit 1

      # The Windows ratchet checks out the complete history when test-cost
      # measurement is requested or policy changes. Keep portable fast unit
      # test runs on the shallow checkout.
      - name: Check out repository (Windows test-cost history)
        if: needs.changes.result == 'success' && needs.changes.outputs.test == 'true' && matrix.os == 'windows-latest' && (contains(github.event.pull_request.labels.*.name, 'allow-test-cost-growth') || contains(github.event.pull_request.labels.*.name, 'run-test-cost') || contains(github.event.pull_request.labels.*.name, 'test-cost') || needs.changes.outputs.test_cost == 'true')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out repository
        if: needs.changes.result == 'success' && needs.changes.outputs.test == 'true' && (matrix.os != 'windows-latest' || (!contains(github.event.pull_request.labels.*.name, 'allow-test-cost-growth') && !contains(github.event.pull_request.labels.*.name, 'run-test-cost') && !contains(github.event.pull_request.labels.*.name, 'test-cost') && needs.changes.outputs.test_cost != 'true'))
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        if: needs.changes.result == 'success' && needs.changes.outputs.test == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # The shared setup-go cache is a first-write-wins partial snapshot;
          # this matrix job restores a dedicated full Go cache below instead.
          cache: false

      # The shared setup-go cache restores a frozen partial snapshot (observed
      # ~91 MB) that forces re-downloading modules and recompiling export data
      # on every PR. A dedicated per-OS cache preserves the full build cache for
      # the portable package matrix; restore-keys fall back to the shared
      # snapshot for a partial warm start on the first run.
      - name: Resolve Go cache paths
        id: go-cache-paths
        if: needs.changes.result == 'success' && needs.changes.outputs.test == 'true'
        shell: bash
        run: |
          echo "go-cache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "go-mod-cache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore dedicated CI Go cache
        id: go-cache
        if: needs.changes.result == 'success' && needs.changes.outputs.test == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.go-cache }}
            ${{ steps.go-cache-paths.outputs.go-mod-cache }}
          key: go-cache-ci-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-cache-ci-${{ runner.os }}-
            setup-go-

      - name: Fast unit tests
        if: needs.changes.result == 'success' && needs.changes.outputs.test == 'true'
        # CLI integration and architecture gates run once on Ubuntu in QA. The
        # platform matrix covers portable public packages without invoking
        # host security posture checks on administrative Windows runners.
        run: go test -timeout=8m ${{ matrix.packages }}

      - name: Windows test-cost ratchet
        if: needs.changes.result == 'success' && matrix.os == 'windows-latest' && (contains(github.event.pull_request.labels.*.name, 'allow-test-cost-growth') || contains(github.event.pull_request.labels.*.name, 'run-test-cost') || contains(github.event.pull_request.labels.*.name, 'test-cost') || needs.changes.outputs.test_cost == 'true')
        shell: pwsh
        env:
          # A labeled PR may authorize a ratchet update, but the orchestrator
          # still measures and reports both targets under the override.
          LIP_ALLOW_ADMIN_USER: "1"
          LIP_ALLOW_TEST_COST_GROWTH: ${{ contains(github.event.pull_request.labels.*.name, 'allow-test-cost-growth') && '1' || '' }}
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP "golip-test-cost-ratchet"
          & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/test-cost-ratchet.ps1 `
            -BaseSHA "${{ github.event.pull_request.base.sha }}" `
            -OutputRoot $outputRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build release binary
        if: needs.changes.result == 'success' && needs.changes.outputs.test == 'true'
        run: go build -trimpath ./cmd/lipstd

      # Preserve the full per-OS cache for the next run; runs even on failure so
      # partial progress is cached, skipped when the primary key already restored.
      - name: Save dedicated CI Go cache
        if: always() && needs.changes.result == 'success' && needs.changes.outputs.test == 'true' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.go-cache }}
            ${{ steps.go-cache-paths.outputs.go-mod-cache }}
          key: go-cache-ci-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Upload Windows test-cost artifacts
        if: always() && matrix.os == 'windows-latest' && (contains(github.event.pull_request.labels.*.name, 'allow-test-cost-growth') || contains(github.event.pull_request.labels.*.name, 'run-test-cost') || contains(github.event.pull_request.labels.*.name, 'test-cost') || needs.changes.outputs.test_cost == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-test-cost
          path: ${{ runner.temp }}/golip-test-cost-ratchet
          if-no-files-found: warn
          retention-days: 14

      - name: Report unrelated PR bypass
        if: needs.changes.result == 'success' && needs.changes.outputs.test != 'true'
        shell: bash
        run: |
          echo "CI test/build matrix bypassed: no test-relevant changes detected."

  db-parity:
    name: Database parity
    needs: changes
    if: always()
    # Required status check: see repo-hygiene above. Always run the job so it
    # reports success (not skip) on docs-only PRs; guard steps.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: lip
          POSTGRES_PASSWORD: lip
          POSTGRES_DB: lip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Fail closed if scope detection failed
        if: needs.changes.result != 'success'
        shell: bash
        run: |
          echo "CI scope detection failed; refusing to bypass required evidence." >&2
          exit 1

      - name: Check out repository
        if: needs.changes.result == 'success' && needs.changes.outputs.test == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        if: needs.changes.result == 'success' && needs.changes.outputs.test == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve Go cache paths
        id: go-cache-paths
        if: needs.changes.result == 'success' && needs.changes.outputs.test == 'true'
        shell: bash
        run: |
          echo "go-cache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "go-mod-cache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore dedicated CI Go cache
        id: go-cache
        if: needs.changes.result == 'success' && needs.changes.outputs.test == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.go-cache }}
            ${{ steps.go-cache-paths.outputs.go-mod-cache }}
          key: go-cache-ci-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-cache-ci-${{ runner.os }}-
            setup-go-

      - name: Verify PostgreSQL test environment
        if: needs.changes.result == 'success' && needs.changes.outputs.test == 'true'
        shell: bash
        env:
          LIP_REQUIRE_POSTGRES: '1'
          LIP_TEST_POSTGRES_DSN: postgres://lip:lip@localhost:5432/lip_test?sslmode=disable
          LIP_TEST_POSTGRES_ADMIN_DSN: postgres://lip:lip@localhost:5432/lip_test?sslmode=disable
        run: |
          set -euo pipefail
          if [[ -z "${LIP_TEST_POSTGRES_DSN:-}" || -z "${LIP_TEST_POSTGRES_ADMIN_DSN:-}" ]]; then
            echo "Error: required PostgreSQL test DSN is unset" >&2
            exit 1
          fi
          if [[ "${LIP_TEST_POSTGRES_DSN}" == *"POOLER"* || "${LIP_TEST_POSTGRES_ADMIN_DSN}" == *"POOLER"* ]]; then
            echo "Error: direct PostgreSQL test DSN must not target a transaction pooler" >&2
            exit 1
          fi
          if [[ "${LIP_REQUIRE_POSTGRES:-}" != "1" ]]; then
            echo "Error: LIP_REQUIRE_POSTGRES must be set to 1" >&2
            exit 1
          fi
          pg_isready -h localhost -p 5432 -U lip -d lip_test
          echo "PostgreSQL test environment verified for direct parity execution."

      - name: Run database dialect parity tests
        if: needs.changes.result == 'success' && needs.changes.outputs.test == 'true'
        env:
          LIP_REQUIRE_POSTGRES: '1'
          LIP_TEST_POSTGRES_DSN: postgres://lip:lip@localhost:5432/lip_test?sslmode=disable
          LIP_TEST_POSTGRES_ADMIN_DSN: postgres://lip:lip@localhost:5432/lip_test?sslmode=disable
          LIP_TEST_PARALLEL: '4'
        run: make test-db-parity

      - name: Report unrelated PR bypass
        if: needs.changes.result == 'success' && needs.changes.outputs.test != 'true'
        shell: bash
        run: |
          echo "Database parity bypassed: documentation-only changes detected."
