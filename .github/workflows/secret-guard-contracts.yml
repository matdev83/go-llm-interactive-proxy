name: SecretGuard contracts

on:
  pull_request:
    paths:
      - '.github/workflows/secret-guard-contracts.yml'
      - 'go.mod'
      - 'go.sum'
      - 'pkg/lipapi/**'
      - 'pkg/lipsdk/secretguard/**'
      - 'internal/plugins/features/secretguard/**'
      - 'internal/stdhttp/auth/**'
      - 'internal/standardplugins/featurehost/secretguard/**'
      - 'internal/core/runtime/**'
      - 'internal/infra/runtimebundle/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/secret-guard-contracts.yml'
      - 'go.mod'
      - 'go.sum'
      - 'pkg/lipapi/**'
      - 'pkg/lipsdk/secretguard/**'
      - 'internal/plugins/features/secretguard/**'
      - 'internal/stdhttp/auth/**'
      - 'internal/standardplugins/featurehost/secretguard/**'
      - 'internal/core/runtime/**'
      - 'internal/infra/runtimebundle/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secretguard-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contracts:
    name: SecretGuard Linux race and streaming contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore shared Go cache
        uses: ./.github/actions/go-cache
        with:
          lane: race

      - name: Record tested revision
        shell: bash
        run: |
          mkdir -p .tmp/secretguard-contracts
          git rev-parse HEAD > .tmp/secretguard-contracts/revision.txt

      - name: Race and incremental streaming contracts
        shell: bash
        run: |
          set -euo pipefail
          # The secretguard race package alone measures 378s cold-cache and
          # 157s warm on a fast host; the previous 5m go-timeout killed cold
          # runs before any test could fail. 12m covers a cold race build
          # with margin inside the 20m job timeout.
          go test -race -count=1 -timeout=12m \
            ./internal/plugins/features/secretguard/... \
            ./internal/stdhttp/auth \
            ./internal/standardplugins/featurehost/secretguard \
            ./pkg/lipsdk/secretguard \
            ./internal/core/runtime \
            ./internal/infra/runtimebundle \
            2>&1 | tee .tmp/secretguard-contracts/race.log

      - name: Canonical parity
        shell: bash
        run: |
          set -euo pipefail
          make parity-checks 2>&1 | tee .tmp/secretguard-contracts/parity.log

      - name: CLI build and smoke
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/lipstd" ./cmd/lipstd
          "$RUNNER_TEMP/lipstd" --help > .tmp/secretguard-contracts/smoke.log 2>&1

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: secretguard-contracts-${{ github.run_id }}
          path: .tmp/secretguard-contracts/
          if-no-files-found: warn
          retention-days: 14
