name: Cursor SDK Platform Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "connectors/cursorsdk/**"
      - "scripts/test-cursor-sdk-platform.*"
      - "Makefile"
      - ".github/workflows/cursor-sdk-platform.yml"

permissions:
  contents: read

jobs:
  platform-smoke:
    name: platform-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Platform smoke (fake bridge)
        run: make test-cursor-sdk-platform
