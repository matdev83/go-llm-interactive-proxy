name: Cursor SDK Platform Smoke

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  # Push and PR events for the same branch share a group, avoiding duplicate runs.
  group: cursor-sdk-platform-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect cursorsdk changes
    runs-on: ubuntu-latest
    outputs:
      cursorsdk: ${{ steps.filter.outputs.cursorsdk }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Runs on every PR so the required bridge-node-tests check always reports;
      # only the 3-OS smoke is gated on cursorsdk-relevant paths.
      - name: Classify changed files
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "cursorsdk=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cursorsdk=false
          while IFS= read -r file; do
            case "$file" in
              connectors/cursorsdk/*|scripts/test-cursor-sdk-platform.*|Makefile|.github/workflows/cursor-sdk-platform.yml)
                cursorsdk=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" HEAD)
          echo "cursorsdk=$cursorsdk" >> "$GITHUB_OUTPUT"

  platform-smoke:
    name: platform-smoke (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.cursorsdk == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            connectors/**/go.sum
            connector-support/**/go.sum
            testdata/enterprise_module/go.sum
            tools/**/go.sum

      - name: Platform smoke (fake bridge)
        run: make test-cursor-sdk-platform

  bridge-node-tests:
    name: bridge-node-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # bridge-node engines require node >=22.13; pin the exact Node version
      # used to verify the CI command sequence locally (22.22.3) so CI is reproducible.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: connectors/cursorsdk/bridge-node/package-lock.json

      - name: Install bridge dependencies
        working-directory: connectors/cursorsdk/bridge-node
        run: npm ci

      # Hermetic unit suite (mocked SDK; live scenarios gated behind CURSOR_SDK_LIVE).
      - name: Bridge unit tests
        working-directory: connectors/cursorsdk/bridge-node
        run: npm test

      - name: Bridge typecheck
        working-directory: connectors/cursorsdk/bridge-node
        run: npm run typecheck
