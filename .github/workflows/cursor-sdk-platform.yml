name: Cursor SDK Platform Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "connectors/cursorsdk/**"
      - "scripts/test-cursor-sdk-platform.*"
      - "Makefile"
      - ".github/workflows/cursor-sdk-platform.yml"

permissions:
  contents: read

jobs:
  platform-smoke:
    name: platform-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Platform smoke (fake bridge)
        run: make test-cursor-sdk-platform

  bridge-node-tests:
    name: bridge-node-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # bridge-node engines require node >=22.13; pin the 22 LTS major.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: connectors/cursorsdk/bridge-node/package-lock.json

      - name: Install bridge dependencies
        working-directory: connectors/cursorsdk/bridge-node
        run: npm ci

      # Hermetic unit suite (mocked SDK; live scenarios gated behind CURSOR_SDK_LIVE).
      - name: Bridge unit tests
        working-directory: connectors/cursorsdk/bridge-node
        run: npm test

      - name: Bridge typecheck
        working-directory: connectors/cursorsdk/bridge-node
        run: npm run typecheck
