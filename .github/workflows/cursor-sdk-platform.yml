name: Cursor SDK Platform Smoke

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  # Push and PR events for the same branch share a group, avoiding duplicate runs.
  group: cursor-sdk-platform-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect cursorsdk changes
    runs-on: ubuntu-latest
    outputs:
      cursorsdk: ${{ steps.filter.outputs.cursorsdk }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Runs on every PR so the required bridge-node-tests check always reports;
      # only the 3-OS smoke is gated on cursorsdk-relevant paths.
      - name: Classify changed files
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "cursorsdk=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cursorsdk=false
          while IFS= read -r file; do
            case "$file" in
              connectors/cursorsdk/*|scripts/test-cursor-sdk-platform.*|.github/workflows/cursor-sdk-platform.yml)
                cursorsdk=true
                break
                ;;
              Makefile)
                # Only a Makefile diff touching cursorsdk targets/recipes justifies
                # the 3-OS platform smoke; other Makefile edits must not burn it.
                # Fail open: only an explicit exit 1 (no scope-relevant lines) may skip.
                probe_rc=0
                bash scripts/makefile-scope.sh --relevant "$BASE_SHA" HEAD cursorsdk || probe_rc=$?
                if [[ "$probe_rc" != "1" ]]; then
                  cursorsdk=true
                  break
                fi
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" HEAD)
          echo "cursorsdk=$cursorsdk" >> "$GITHUB_OUTPUT"

  platform-smoke:
    name: platform-smoke (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.cursorsdk == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # Shared setup-go cache is a frozen first-write-wins partial snapshot;
          # this matrix restores a dedicated full cache below instead.
          cache: false

      - name: Resolve Go cache paths
        id: go-cache-paths
        shell: bash
        run: |
          echo "go-cache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "go-mod-cache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore dedicated cursorsdk Go cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.go-cache }}
            ${{ steps.go-cache-paths.outputs.go-mod-cache }}
          key: go-cache-cursorsdk-${{ runner.os }}-${{ hashFiles('go.sum', 'connectors/**/go.sum', 'connector-support/**/go.sum', 'testdata/enterprise_module/go.sum', 'tools/**/go.sum') }}
          restore-keys: |
            go-cache-cursorsdk-${{ runner.os }}-
            setup-go-

      - name: Platform smoke (fake bridge)
        run: make test-cursor-sdk-platform

      - name: Save dedicated cursorsdk Go cache
        if: always() && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.go-cache }}
            ${{ steps.go-cache-paths.outputs.go-mod-cache }}
          key: go-cache-cursorsdk-${{ runner.os }}-${{ hashFiles('go.sum', 'connectors/**/go.sum', 'connector-support/**/go.sum', 'testdata/enterprise_module/go.sum', 'tools/**/go.sum') }}

  bridge-node-tests:
    name: bridge-node-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # bridge-node engines require node >=22.13; pin the exact Node version
      # used to verify the CI command sequence locally (22.22.3) so CI is reproducible.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: connectors/cursorsdk/bridge-node/package-lock.json

      - name: Install bridge dependencies
        working-directory: connectors/cursorsdk/bridge-node
        run: npm ci

      # Hermetic unit suite (mocked SDK; live scenarios gated behind CURSOR_SDK_LIVE).
      - name: Bridge unit tests
        working-directory: connectors/cursorsdk/bridge-node
        run: npm test

      - name: Bridge typecheck
        working-directory: connectors/cursorsdk/bridge-node
        run: npm run typecheck
