name: Cursor SDK Platform Smoke

on:
  push:
    branches: [main]
    paths:
      - "connectors/cursorsdk/**"
      - "scripts/test-cursor-sdk-platform.*"
      - ".github/workflows/cursor-sdk-platform.yml"
      - ".github/actions/go-cache/**"
      - "scripts/ci-go-cache.py"
      - "Makefile"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  # Push and PR events for the same branch share a group, avoiding duplicate runs.
  group: cursor-sdk-platform-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect cursorsdk changes
    runs-on: ubuntu-latest
    outputs:
      cursorsdk: ${{ steps.filter.outputs.cursorsdk }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Runs on every PR so the required bridge-node-tests check always reports;
      # only the 3-OS smoke is gated on cursorsdk-relevant paths.
      - name: Classify changed files
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" && "$EVENT_NAME" != "push" ]] || [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0{40}$ ]]; then
            echo "cursorsdk=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git rev-parse --verify "${BASE_SHA}^{commit}" >/dev/null
          cursorsdk=false
          while IFS= read -r file; do
            case "$file" in
              .github/actions/go-cache/**|scripts/ci-go-cache.py)
                cursorsdk=true
                break
                ;;
              connectors/cursorsdk/*|scripts/test-cursor-sdk-platform.*|.github/workflows/cursor-sdk-platform.yml)
                cursorsdk=true
                break
                ;;
              Makefile)
                # Only a Makefile diff touching cursorsdk targets/recipes justifies
                # the 3-OS platform smoke; other Makefile edits must not burn it.
                # Fail open: only an explicit exit 1 (no scope-relevant lines) may skip.
                probe_rc=0
                bash scripts/makefile-scope.sh --relevant "$BASE_SHA" HEAD cursorsdk || probe_rc=$?
                if [[ "$probe_rc" != "1" ]]; then
                  cursorsdk=true
                  break
                fi
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" HEAD)
          echo "cursorsdk=$cursorsdk" >> "$GITHUB_OUTPUT"

  platform-smoke:
    name: platform-smoke (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.cursorsdk == 'true'
    runs-on: ${{ needs.changes.outputs.cursorsdk == 'true' && matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # The shared composite owns cache identity, size and main publication.
          cache: false

      - name: Restore bounded cursorsdk Go cache
        uses: ./.github/actions/go-cache
        with:
          lane: cursorsdk

      - name: Platform smoke (fake bridge)
        run: make test-cursor-sdk-platform

      - name: Save bounded cursorsdk Go cache
        if: success()
        uses: ./.github/actions/go-cache
        with:
          lane: cursorsdk
          phase: save

  bridge-node-tests:
    name: bridge-node-tests
    needs: changes
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fail closed if scope detection failed
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Report unrelated bridge bypass
        if: needs.changes.result == 'success' && needs.changes.outputs.cursorsdk != 'true'
        run: echo "Bridge tests bypassed; no Cursor SDK changes."
      - name: Checkout
        if: needs.changes.result == 'success' && needs.changes.outputs.cursorsdk == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # bridge-node engines require node >=22.13; pin the exact Node version
      # used to verify the CI command sequence locally (22.22.3) so CI is reproducible.
      - name: Setup Node
        if: needs.changes.result == 'success' && needs.changes.outputs.cursorsdk == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: connectors/cursorsdk/bridge-node/package-lock.json

      - name: Install bridge dependencies
        if: needs.changes.result == 'success' && needs.changes.outputs.cursorsdk == 'true'
        working-directory: connectors/cursorsdk/bridge-node
        run: npm ci

      # Hermetic unit suite (mocked SDK; live scenarios gated behind CURSOR_SDK_LIVE).
      - name: Bridge unit tests
        if: needs.changes.result == 'success' && needs.changes.outputs.cursorsdk == 'true'
        working-directory: connectors/cursorsdk/bridge-node
        run: npm test

      - name: Bridge typecheck
        if: needs.changes.result == 'success' && needs.changes.outputs.cursorsdk == 'true'
        working-directory: connectors/cursorsdk/bridge-node
        run: npm run typecheck
