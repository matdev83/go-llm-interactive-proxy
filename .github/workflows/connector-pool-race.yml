# Focused Linux race detector for the connector-pool ratchets.
name: Connector pool race

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/go-cache/**"
      - "scripts/ci-go-cache.py"
      - "internal/infra/runtimebundle/**"
      - "internal/infra/backendplugins/adapter/**"
      - "internal/core/execbackend/**"
      - "pkg/lipsdk/backendplugin/**"
      - "internal/infra/backendplugins/processhost/**"
      - ".github/workflows/connector-pool-race.yml"

  pull_request:
    paths:
      - ".github/actions/go-cache/**"
      - "scripts/ci-go-cache.py"
      - "internal/infra/runtimebundle/**"
      - "internal/infra/backendplugins/adapter/**"
      - "internal/core/execbackend/**"
      - "pkg/lipsdk/backendplugin/**"
      - "internal/infra/backendplugins/processhost/**"
      - ".github/workflows/connector-pool-race.yml"

permissions:
  contents: read

concurrency:
  group: connector-pool-race-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  connector-pool-race:
    name: Linux race detector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore bounded race Go cache
        uses: ./.github/actions/go-cache
        with:
          lane: race

      - name: Run targeted Linux races
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 -p 2 -parallel 4 \
            ./internal/infra/runtimebundle \
            ./pkg/lipsdk/backendplugin \
            ./pkg/lipsdk/backendplugin/host \
            ./internal/infra/backendplugins/processhost

      - name: Save bounded race Go cache
        if: success()
        uses: ./.github/actions/go-cache
        with:
          lane: race
          phase: save
