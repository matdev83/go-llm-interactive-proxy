# Narrow Phase 9.4 gate: connector platform matrix + native lifecycle/IPC on
# Ubuntu, macOS, and Windows. Not a duplicate of full QA.
name: Backend plugin cross-platform

on:
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "connectors/**"
      - "connector-support/**"
      - "tools/backendplugin/**"
      - "internal/infra/backendplugins/**"
      - "internal/archtest/backend_plugin_cross_platform_ci_test.go"
      - "Makefile"
      - ".github/workflows/backend-plugin-cross-platform.yml"
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - "connectors/**"
      - "connector-support/**"
      - "tools/backendplugin/**"
      - "internal/infra/backendplugins/**"
      - "internal/archtest/backend_plugin_cross_platform_ci_test.go"
      - "Makefile"
      - ".github/workflows/backend-plugin-cross-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-plugin-cross-platform-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect connector scope
    runs-on: ubuntu-latest
    outputs:
      select: ${{ steps.select.outputs.select }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select changed connectors
        id: select
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "select=" >> "$GITHUB_OUTPUT"
          else
            echo "select=$(bash scripts/cross-platform-selection.sh "$BASE_SHA" HEAD)" >> "$GITHUB_OUTPUT"
          fi
  cross-platform-qa:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            connectors/**/go.sum
            connector-support/**/go.sum

      - name: Cross-platform QA
        env:
          CROSS_PLATFORM_SELECT: ${{ needs.changes.outputs.select }}
          GOFLAGS: -buildvcs=false
        run: make backend-plugin-cross-platform-qa
