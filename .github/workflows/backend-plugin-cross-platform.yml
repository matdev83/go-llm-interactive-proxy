# Narrow Phase 9.4 gate: connector platform matrix + native lifecycle/IPC on
# Ubuntu, macOS, and Windows. Not a duplicate of full QA.
name: Backend plugin cross-platform

on:
  pull_request:
    paths:
      - "connectors/**"
      - "connector-support/**"
      - "tools/backendplugin/**"
      - "internal/infra/backendplugins/**"
      - "internal/archtest/backend_plugin_cross_platform_ci_test.go"
      - "Makefile"
      - ".github/workflows/backend-plugin-cross-platform.yml"
  push:
    paths:
      - "connectors/**"
      - "connector-support/**"
      - "tools/backendplugin/**"
      - "internal/infra/backendplugins/**"
      - "internal/archtest/backend_plugin_cross_platform_ci_test.go"
      - "Makefile"
      - ".github/workflows/backend-plugin-cross-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform-qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            connectors/**/go.sum
            connector-support/**/go.sum

      - name: Cross-platform QA
        run: make backend-plugin-cross-platform-qa
