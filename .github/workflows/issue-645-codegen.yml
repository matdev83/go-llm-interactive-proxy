name: Issue 645 one-shot codegen

on:
  push:
    branches:
      - feat/645-session-classification

permissions:
  contents: write

jobs:
  codegen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/645-session-classification
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Regenerate feature plane access
        run: go run ./scripts/generate-feature-planes.go
      - name: Commit generated output and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkg/lipsdk/feature/plane_generated.go
          git rm .github/workflows/issue-645-codegen.yml
          git commit -m "chore(feature): regenerate session classifier plane"
          git push origin HEAD:feat/645-session-classification
