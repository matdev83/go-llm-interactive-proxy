name: QA

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: qa
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Formatting and module integrity
        shell: bash
        run: |
          test -z "$(gofmt -l cmd internal pkg)"
          go mod verify
          git diff --exit-code -- go.mod go.sum

      - name: Architecture guardrails
        run: go test -timeout=8m ./internal/archtest

      - name: Vet release command
        run: go vet ./cmd/lipstd

      - name: Test release command
        run: go test -timeout=5m ./cmd/lipstd
