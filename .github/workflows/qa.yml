name: QA

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          code=false
          while IFS= read -r file; do
            case "$file" in
              *.md|docs/*) ;;
              *) code=true; break ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" HEAD)
          echo "code=$code" >> "$GITHUB_OUTPUT"

  qa:
    name: qa
    needs: changes
    # Not currently a required check, but keep the same convention as the
    # required jobs (ci.yml repo-hygiene): always run the job and guard the
    # steps so it reports success (not skip) on docs-only PRs, and would not
    # block merges if ever added to branch protection.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Formatting and module integrity
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          test -z "$(gofmt -l cmd internal pkg)"
          go mod verify
          git diff --exit-code -- go.mod go.sum

      - name: Architecture guardrails
        if: needs.changes.outputs.code == 'true'
        run: go test -timeout=8m ./internal/archtest

      - name: Vet release command
        if: needs.changes.outputs.code == 'true'
        run: go vet ./cmd/lipstd

      - name: Test release command
        if: needs.changes.outputs.code == 'true'
        run: go test -timeout=5m ./cmd/lipstd
