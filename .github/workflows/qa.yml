name: QA

on:
  pull_request:

permissions:
  contents: read

concurrency:
  # Share the branch/PR group with equivalent runs so a new push cancels
  # the superseded QA run instead of consuming another hosted runner.
  group: qa-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      test: ${{ steps.filter.outputs.test }}
      profile: ${{ steps.filter.outputs.profile }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate CI scope matcher
        shell: bash
        run: bash scripts/ci-scope.sh --self-test

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # The heavy QA job owns the dedicated complete cache below. Avoid
          # creating another shared setup-go snapshot in the classifier job.
          cache: false
          cache-dependency-path: |
            go.sum
            connectors/**/go.sum
            connector-support/**/go.sum
            testdata/enterprise_module/go.sum
            tools/**/go.sum

      - name: Classify changed files
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          bash scripts/ci-scope.sh --outputs "${BASE_SHA:-}" HEAD >> "$GITHUB_OUTPUT"
          # The Go reporter is the sole change-surface policy owner. It emits
          # code/profile directly; the shell classifier supplies the scoped test
          # output used to avoid running QA for documentation-only changes.
          go run ./internal/archtest/tools/changesurface/cmd \
            -base "$BASE_SHA" \
            -github-output "$GITHUB_OUTPUT" \
            -json

  qa:
    name: qa
    needs: changes
    if: always()
    # Not currently a required check, but keep the same convention as the
    # required jobs (ci.yml repo-hygiene): always run the job and guard the
    # steps so it reports success (not skip) on docs-only PRs, and would not
    # block merges if ever added to branch protection.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fail closed if scope detection failed
        if: needs.changes.result != 'success'
        shell: bash
        run: |
          echo "QA scope detection failed; refusing to bypass architecture evidence." >&2
          exit 1

      - name: Checkout
        if: needs.changes.result == 'success' && needs.changes.outputs.test == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        if: needs.changes.result == 'success' && needs.changes.outputs.test == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # The shared setup-go cache is a first-write-wins partial snapshot saved
          # by whichever job finishes first; this job restores a dedicated full
          # Go cache below instead, so the heavy archtest never cold-loads.
          cache: false

      # The QA job runs the full-repo archtest package load, which needs the
      # complete module graph and build cache. A dedicated per-job cache avoids
      # the frozen partial snapshot under the shared setup-go key (observed as a
      # ~91 MB restore that forces re-downloading every module and recompiling
      # all export data, ~5 min per PR). restore-keys fall back to the shared
      # setup-go snapshot so the first run still gets a partial warm start.
      - name: Restore dedicated QA Go cache
        id: go-cache
        if: needs.changes.result == 'success' && needs.changes.outputs.test == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-cache-qa-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-cache-qa-${{ runner.os }}-
            setup-go-

      - name: Formatting and module integrity
        if: needs.changes.result == 'success' && needs.changes.outputs.test == 'true'
        shell: bash
        run: |
          test -z "$(gofmt -l cmd internal pkg)"
          go mod verify
          git diff --exit-code -- go.mod go.sum

      - name: Architecture guardrails
        if: needs.changes.result == 'success' && needs.changes.outputs.test == 'true'
        run: go test -timeout=8m ./internal/archtest

      - name: Vet release command
        if: needs.changes.result == 'success' && needs.changes.outputs.test == 'true'
        run: go vet ./cmd/lipstd

      - name: Provider-profile change-surface ratchet
        if: needs.changes.outputs.profile == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: go run ./internal/archtest/tools/changesurface/cmd -base "$BASE_SHA" -profile-only -json

      # CI owns the portable cmd/lipstd test/build matrix. QA retains the
      # distinct architecture and vet evidence instead of recompiling this
      # package a second time on Ubuntu.

      # Save after the heavy archtest so the full module graph + build cache is
      # preserved for the next PR. Runs even on failure so partial progress is
      # cached; skipped when the primary key already restored a complete cache.
      - name: Save dedicated QA Go cache
        if: always() && needs.changes.result == 'success' && needs.changes.outputs.test == 'true' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-cache-qa-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Report unrelated PR bypass
        if: needs.changes.result == 'success' && needs.changes.outputs.test != 'true'
        shell: bash
        run: |
          echo "QA bypassed: no test-relevant changes detected."
