name: QA

on:
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          # Finer cache key than go.mod alone; restores module + build cache (see setup-go README).
          cache-dependency-path: go.sum

      - name: Quality checks
        run: make quality-checks

      - name: Architecture report (advisory artifact)
        # Write to RUNNER_TEMP (outside the repo tree) so the generated artifact
        # does not land in the repo root and trip TestRootHygiene_MarkdownFiles,
        # which only permits AGENTS.md and README.md at root.
        run: make arch-report > "$RUNNER_TEMP/arch-report.md"
        continue-on-error: true

      - name: Upload architecture report
        uses: actions/upload-artifact@v4
        with:
          name: arch-report
          path: ${{ runner.temp }}/arch-report.md
        if: always()

      # Conformance/parity suites live under ./internal/testkit/conformance/... and run here (no duplicate step).
      - name: Unit tests
        run: go test -parallel=8 -tags=precommit,integration ./...

      - name: Release gates (fuzz smoke)
        env:
          # ~30 targets × FUZZTIME; keep within job timeout alongside race + lint.
          FUZZTIME: 6s
        run: make test-fuzz

      - name: Race detector
        run: bash scripts/race-check.sh --strict

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=10m

      - name: govulncheck
        run: go tool govulncheck ./...
