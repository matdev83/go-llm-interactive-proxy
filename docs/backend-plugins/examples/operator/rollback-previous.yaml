# Rollback: point discovery at the previous published plugin root (no lipstd rebuild).
plugins:
  backend_discovery:
    enabled: true
    development_mode: true
    strict: true
    paths:
      - .golip-plugins/previous/localstub
  backends:
    - kind: local-stub
      id: rolled-back-stub
      enabled: true
      config:
        text: "[operator] rollback previous"
