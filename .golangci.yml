version: "2"

run:
  timeout: 10m
  # Linting *_test.go catches more issues but roughly doubles analyzer work vs tests: false.
  tests: true

linters:
  default: none
  enable:
    - staticcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - forcetypeassert
    - errcheck
    - paralleltest
    - thelper
    - modernize
  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: indent-error-flow
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      # Stateful database and lifecycle tests deliberately run serially.
      - path: ^(cmd/lipstd|internal/(core/(config|runtime)|infra/(db|dbmigrate|metering/journalstore|metrics|runtimebundle)|testkit)|pkg/lipsdk/metering)/.*_test\.go$
        linters:
          - paralleltest
      # Cursor SDK bridge/process/pool lifecycle tests share fakebridge and process state.
      - path: ^connectors/cursorsdk/internal/product/.*_test\.go$
        linters:
          - paralleltest
      # JSON wire-shape changes need contract review, not bulk lint autofixes.
      - text: "Omitempty has no effect on nested struct fields"
        linters:
          - modernize

formatters:
  enable:
    - gofumpt
